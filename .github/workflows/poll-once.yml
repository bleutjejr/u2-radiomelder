# One-shot poll so the JOE now-playing line is in a finished job log.
# Notify is disabled here; the long-running watcher is the thing that alerts.
name: Poll once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/poll-once.yml

permissions:
  contents: read

jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Poll without notifying
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u - << 'PY'
          import logging
          import watcher
          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s", force=True)
          watcher.notify = lambda *a, **k: logging.warning("notify suppressed")
          watcher.poll({"alerted": {}}, ignore_schedule=False)
          PY
